name: CI/CD

# 什么时候跑：
#   - 往 main 推代码         → 走完整流水线（构建 → 测试 → 部署到服务器）
#   - 提 PR 到 main          → 只跑构建 + 测试，拦截坏代码（不部署）
#   - 手动触发               → 在 Actions 页面点 "Run workflow"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的流水线，不浪费 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只给读权限，需要写权限的 job 单独声明（最小权限原则）。
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # 站点部署在自有服务器根路径（nginx root = /home/ubuntu/zero-to-tech/dist），
  # 静态资源前缀用 "/" 即可，vite.config.js 会读取这个变量。
  BASE_PATH: "/"

jobs:
  # ── 阶段一：构建 + 测试（所有分支都跑）────────────────────────────
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm # 缓存 npm 依赖，后续流水线提速

      - name: 安装依赖
        # 用 ci 而不是 install：严格按 package-lock.json 安装，版本可复现
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  # ── 阶段二：部署到自有服务器（仅 main 分支的 push）────────────────
  # 依赖 build-and-test 成功：测试挂了就不会部署，坏代码进不了服务器。
  deploy:
    name: 部署到服务器
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检查部署所需 Secrets 是否已配置
        # 缺 Secret 时给出能看懂的提示，而不是一句晦涩的 rsync 报错
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=""
          [ -z "$SERVER_HOST" ]    && missing="$missing SERVER_HOST"
          [ -z "$SERVER_USER" ]    && missing="$missing SERVER_USER"
          [ -z "$SERVER_SSH_KEY" ] && missing="$missing SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::以下 Secrets 未配置：$missing"
            echo "::error::到仓库 Settings → Secrets and variables → Actions → New repository secret 添加"
            echo "::error::配好后回到本次运行页面点右上角 Re-run failed jobs 即可，无需重新 push"
            exit 1
          fi

      - name: 下载构建产物
        # 直接复用阶段一产出的 dist，不在部署机上重复装依赖和构建
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: 同步到服务器
        # rsync --delete：让服务器目录与本次构建完全一致，不留旧文件。
        # --exclude=.well-known：避免误删 HTTPS 证书（Let's Encrypt webroot 模式）的
        #   校验目录；如果服务器不用 webroot 方式续签证书，这段可以删掉。
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: "-avzr --delete --exclude=.well-known"
          path: dist/
          remote_path: /home/ubuntu/zero-to-tech/dist/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_port: 22
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
