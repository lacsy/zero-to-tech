name: CI/CD

# 什么时候跑：
#   - 往 main 推代码         → 走完整流水线（构建 → 测试 → 部署到服务器）
#   - 提 PR 到 main          → 只跑构建 + 测试，拦截坏代码（不部署）
#   - 手动触发               → 在 Actions 页面点 "Run workflow"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的流水线，不浪费 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只给读权限。
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # 站点部署在自有服务器根路径（nginx root = /home/ubuntu/zero-to-tech/dist），
  # 静态资源前缀用 "/" 即可，vite.config.js 会读取这个变量。
  BASE_PATH: "/"

jobs:
  # ── 阶段一：构建 + 测试（所有分支都跑）────────────────────────────
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm # 缓存 npm 依赖，后续流水线提速

      - name: 安装依赖
        # 用 ci 而不是 install：严格按 package-lock.json 安装，版本可复现
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  # ── 阶段二：部署到自有服务器（仅 main 分支的 push）────────────────
  # 依赖 build-and-test 成功：测试挂了就不会部署，坏代码进不了服务器。
  deploy:
    name: 部署到服务器
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检查部署所需 Secrets 是否已配置
        # 缺 Secret 时给出能看懂的提示，而不是一句晦涩的报错
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=""
          [ -z "$SERVER_HOST" ]    && missing="$missing SERVER_HOST"
          [ -z "$SERVER_USER" ]    && missing="$missing SERVER_USER"
          [ -z "$SERVER_SSH_KEY" ] && missing="$missing SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::以下 Secrets 未配置：$missing"
            echo "::error::到仓库 Settings → Secrets and variables → Actions → New repository secret 添加"
            echo "::error::配好后回到本次运行页面点右上角 Re-run failed jobs 即可，无需重新 push"
            exit 1
          fi

      - name: 下载构建产物
        # 直接复用阶段一产出的 dist，不在部署机上重复装依赖和构建
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: 写入并校验 SSH 私钥
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 归一化：清掉可能混入的 \r，并保证结尾恰好一个换行。
          # 这两个是最常见的"钥匙看着没问题却加载失败"的原因。
          printf '%s\n' "$(printf '%s' "$SSH_KEY" | tr -d '\r')" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ── Secret 内容体检：只打印元信息（行数/头尾行），不打印钥匙本体 ──
          echo "── Secret 内容体检 ──────────────────────────────"
          echo "字节数   : $(printf '%s' "$SSH_KEY" | wc -c | tr -d ' ')"
          echo "行数     : $(printf '%s' "$SSH_KEY" | wc -l | tr -d ' ')"
          echo "首行     : $(printf '%s' "$SSH_KEY" | head -c 40)"
          echo "末行     : $(printf '%s' "$SSH_KEY" | tail -n1)"
          echo "字面\\n   : $(printf '%s' "$SSH_KEY" | grep -o '\\n' | wc -l | tr -d ' ') 处"
          echo "BEGIN 行 : $(printf '%s' "$SSH_KEY" | grep -c -- '-----BEGIN' | tr -d ' ') 处"
          echo "END 行   : $(printf '%s' "$SSH_KEY" | grep -c -- '-----END' | tr -d ' ') 处"
          echo "──────────────────────────────────────────────────"
          echo "（对照正常的 ed25519 私钥：≈400 字节 / 4 行 / 首行 -----BEGIN OPENSSH PRIVATE KEY----- / 末行 -----END OPENSSH PRIVATE KEY----- / 字面\\n 0 处 / BEGIN 与 END 各 1 处）"

          # 校验：解析不了就立刻报错并说明原因，不再等到 rsync 才莫名其妙地挂
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/pub.key 2>/tmp/key.err; then
            echo "::error::Secret 里的私钥无法被 ssh 解析：$(cat /tmp/key.err)"
            echo "::error::常见原因：① 这把钥匙其实设了密码（CI 里无法交互输入）"
            echo "::error::            ② 复制时丢了 -----BEGIN/END ... PRIVATE KEY----- 头尾"
            echo "::error::            ③ 换行被贴成了字面的 \\n 字符"
            echo "::error::推荐用 gh 绕过剪贴板重写：gh secret set SERVER_SSH_KEY < ~/.ssh/gh_deploy"
            exit 1
          fi

          # 打印公钥指纹（公开信息，可以放心展示）。
          # 和本地 `ssh-keygen -lf ~/.ssh/gh_deploy` 的输出对比：
          #   一致 → Secret 内容就是这把钥匙，问题不在它
          #   不一致 → Secret 被改坏了，重写 Secret
          echo "Secret 中钥匙的公钥指纹："
          ssh-keygen -lf /tmp/pub.key

      - name: 同步到服务器
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -avzr --delete --exclude=.well-known \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=accept-new" \
            dist/ "$SERVER_USER@$SERVER_HOST:/home/ubuntu/zero-to-tech/dist/"
